name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skins/network-sphere/package-lock.json
      - name: Install Network Sphere
        working-directory: skins/network-sphere
        run: npm ci
      - name: Assemble gallery
        run: node scripts/assemble-site.mjs
      - name: Copy pages onto the branch
        run: node scripts/publish-branch.mjs
      - name: Commit published pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html .nojekyll network-sphere token-lake
          if git diff --cached --quiet; then
            echo "Published pages already match."
          else
            git commit -m "Publish gallery pages [skip ci]"
            git push || echo "Could not push published pages; the committed copy stays in place."
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
